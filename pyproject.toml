[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperx-haste2"
version = "0.1.0"
description = "Linux driver and settings GUI for the HyperX Pulsefire Haste 2 Pro 4K mouse"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["PyQt6", "evdev"]

[project.scripts]
hyperx-haste2 = "hyperx_haste2.cli:main"

[tool.setuptools]
packages = ["hyperx_haste2"]
